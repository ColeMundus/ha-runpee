[project]
name = "ha-runpee"
version = "0.2.0"
description = "Unofficial RunPee integration for Home Assistant"
requires-python = ">=3.14.2,<3.15"
dependencies = []

[dependency-groups]
dev = [
  "homeassistant==2026.10.0",
  "pytest-homeassistant-custom-component==0.13.371",
  {include-group = "tools"},
]
latest = [
  "homeassistant==2026.11.0",
  "pytest-homeassistant==2026.11.0",
  {include-group = "tools"},
]
tools = [
  "ruff==0.17.3",
  "mypy==2.4.1",
  "pytest-cov==7.1.0",
]

[tool.uv]
conflicts = [[{group = "dev"}, {group = "latest"}]]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Core 2026.11 must install its HTTPX alias before respx imports HTTPX.
# Provider tests use real loopback aiohttp, not the respx fixture.
addopts = "-p no:respx --disable-socket --allow-unix-socket"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["custom_components/runpee"]
follow_imports = "silent"
