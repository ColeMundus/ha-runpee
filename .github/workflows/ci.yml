name: CI
on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * 1'
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  scope:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Identify Markdown-only changes
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 - <<'PYTHON'
          import os
          import subprocess

          known = {b"README.md", b"CONTRIBUTING.md", b"SECURITY.md", b"CHANGELOG.md"}
          diff = subprocess.run(
              ["git", "diff", "--name-only", "-z", "--no-renames", os.environ["BASE_SHA"], "HEAD", "--"],
              stdout=subprocess.PIPE,
              check=False,
          )
          paths = diff.stdout.split(b"\0")[:-1]
          docs_only = diff.returncode == 0 and bool(paths) and all(
              path in known or (path.startswith(b"docs/") and path.endswith(b".md"))
              for path in paths
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"docs_only={str(docs_only).lower()}", file=output)
          print("Markdown-only draft" if docs_only else "Full validation required")
          PYTHON

  draft-lint:
    if: needs.scope.outputs.docs_only == 'true'
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.14.7'
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: draft-lint
      - run: uv sync --locked --no-default-groups --group dev
      - name: Run lint, formatting and available type checks
        shell: bash
        run: |
          status=0
          printf "\n> %s\n" "uv run --no-sync ruff check ."
          uv run --no-sync ruff check . || status=1
          printf "\n> %s\n" "uv run --no-sync ruff format --check ."
          uv run --no-sync ruff format --check . || status=1
          exit "$status"
  checks:
    if: ${{ !cancelled() && needs.scope.outputs.docs_only != 'true' }}
    needs: scope
    name: checks (${{ matrix.lane }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: minimum
            group: dev
          - lane: latest
            group: latest
    runs-on: ubuntu-latest
    env:
      UV_PROJECT_ENVIRONMENT: .venv-${{ matrix.lane }}
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.19'
          python-version: '3.14.7'
          enable-cache: true
      - run: uv sync --locked --no-default-groups --group "${{ matrix.group }}"
      - run: uv pip check --python "$UV_PROJECT_ENVIRONMENT/bin/python"
      - name: Verify target framework
        run: |
          uv run --no-sync python scripts/check_compat.py "${{ matrix.lane }}"
      - name: Run lint, formatting and available type checks
        shell: bash
        run: |
          status=0
          printf "\n> %s\n" "uv run --no-sync ruff check ."
          uv run --no-sync ruff check . || status=1
          printf "\n> %s\n" "uv run --no-sync ruff format --check ."
          uv run --no-sync ruff format --check . || status=1
          printf "\n> %s\n" "uv run --no-sync mypy"
          uv run --no-sync mypy || status=1
          exit "$status"
      - run: git diff --check
      - run: uv run --no-sync pytest --cov=custom_components.runpee --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=90
      - run: uv run --no-sync python scripts/package.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runpee-manual-install-${{ matrix.lane }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  actionlint:
    if: ${{ !cancelled() && needs.scope.outputs.docs_only != 'true' }}
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
  hassfest:
    if: ${{ !cancelled() && needs.scope.outputs.docs_only != 'true' }}
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361
  hacs:
    needs: scope
    if: ${{ !cancelled() && (github.event.repository.private == false) && needs.scope.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration
  hacs-direct-candidate:
    needs: scope
    if: ${{ !cancelled() && (github.event.repository.private == false) && needs.scope.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate HACS repository
        uses: docker://ghcr.io/hacs/action@sha256:187499a09c5d41f9f0d42ff80d203ed87b974c028290140913b61e005fb0aab2
        env:
          INPUT_CATEGORY: integration
          INPUT_COMMENT: 'true'
          INPUT_GITHUB_TOKEN: ${{ github.token }}
  required:
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'Draft validation' || 'required' }}
    if: ${{ always() && needs.scope.outputs.docs_only != 'true' }}
    needs: [scope, checks, actionlint, hassfest, hacs]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/check_ci.py
        env:
          NEEDS: ${{ toJSON(needs) }}
          PRIVATE: ${{ toJSON(github.event.repository.private) }}
